<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>RTK Kanji Explorer</title>
  <style>
    :root {
      --bg-main: #18181c;
      --bg-card: #23232a;
      --border: #33333f;
      --accent: #6366f1;
      --accent-light: rgba(99, 102, 241, 0.15);
      --text: #f3f4f6;
      --text-muted: #9ca3af;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-main);
      color: var(--text);
      display: flex;
      height: 100vh;
      overflow: hidden;
    }

    /* Sidebar */
    #sidebar {
      width: 320px;
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      background: #111115;
    }
    .search-box {
      padding: 16px;
      border-bottom: 1px solid var(--border);
    }
    .search-box input {
      width: 100%;
      padding: 10px 14px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text);
      font-size: 15px;
      outline: none;
    }
    .search-box input:focus { border-color: var(--accent); }
    #kanji-list {
      flex: 1;
      overflow-y: auto;
      list-style: none;
    }
    #kanji-list li {
      padding: 12px 16px;
      border-bottom: 1px solid rgba(255,255,255,0.04);
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    #kanji-list li:hover, #kanji-list li.active {
      background: var(--bg-card);
    }
    .list-kanji { font-size: 20px; font-weight: bold; }
    .list-meta { font-size: 13px; color: var(--text-muted); }

    /* Main Area */
    #main-content {
      flex: 1;
      overflow-y: auto;
      padding: 40px;
    }
    .kanji-header {
      display: flex;
      align-items: baseline;
      gap: 20px;
      margin-bottom: 24px;
      border-bottom: 1px solid var(--border);
      padding-bottom: 20px;
    }
    .main-kanji {
      font-size: 80px;
      font-weight: bold;
      line-height: 1;
    }
    .heisig-badge {
      background: var(--accent);
      color: #fff;
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 14px;
      font-weight: bold;
    }
    .keyword-title {
      font-size: 28px;
      color: #e5e7eb;
      text-transform: capitalize;
    }
    
    .card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 20px;
      margin-bottom: 20px;
    }
    .card-title {
      font-size: 13px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-muted);
      margin-bottom: 12px;
      font-weight: 600;
    }
    .story-text {
      font-size: 18px;
      line-height: 1.6;
      white-space: pre-wrap;
    }
    
    /* Interactive Inline Kanji Links */
    .kanji-link {
      color: #818cf8;
      background: var(--accent-light);
      padding: 2px 6px;
      border-radius: 4px;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.15s ease;
    }
    .kanji-link:hover {
      background: var(--accent);
      color: #fff;
    }

    .tags-container {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      max-height: 200px;
      overflow-y: auto;
    }
    .tag-item {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(255,255,255,0.03);
      border: 1px solid var(--border);
      padding: 6px 12px;
      border-radius: 6px;
      cursor: pointer;
    }
    .tag-item:hover {
      border-color: var(--accent);
      background: var(--accent-light);
    }

    .empty-state {
      text-align: center;
      margin-top: 100px;
      color: var(--text-muted);
    }
  </style>
</head>
<body>

  <div id="sidebar">
    <div class="search-box">
      <input type="text" id="search-input" placeholder="Search Kanji, Keyword, #..." />
    </div>
    <ul id="kanji-list"></ul>
  </div>

  <div id="main-content">
    <div id="display-area">
      <div class="empty-state">Loading database...</div>
    </div>
  </div>

  <script>
    let kanjiDb = {};
    let activeKanji = null;

    function decodeHtml(htmlStr) {
      const txt = document.createElement("textarea");
      txt.innerHTML = htmlStr;
      return txt.value;
    }

    async function loadDatabase() {
      try {
        const response = await fetch('./kanji_db.json');
        if (!response.ok) throw new Error('Could not load kanji_db.json');
        kanjiDb = await response.json();
        renderList(Object.keys(kanjiDb));

        const hashKanji = decodeURIComponent(window.location.hash.replace('#', ''));
        const initialKanji = (hashKanji && kanjiDb[hashKanji]) ? hashKanji : Object.keys(kanjiDb)[0];
        
        if (initialKanji) {
          showKanjiDetails(initialKanji);
        }
      } catch (err) {
        document.getElementById('display-area').innerHTML = `
          <div class="card" style="border-color: #ef4444;">
            <h3>Error loading database</h3>
            <p style="margin-top:8px; color:var(--text-muted)">Ensure <code>kanji_db.json</code> is located in the root directory alongside <code>index.html</code>.</p>
          </div>`;
      }
    }

    function renderList(kanjiKeys) {
      const listEl = document.getElementById('kanji-list');
      listEl.innerHTML = '';

      kanjiKeys.forEach(key => {
        const item = kanjiDb[key];
        const li = document.createElement('li');
        li.className = (activeKanji === key) ? 'active' : '';
        li.innerHTML = `
          <div>
            <span class="list-kanji">${item.kanji}</span>
            <span style="margin-left: 8px;">${decodeHtml(item.keyword)}</span>
          </div>
          <span class="list-meta">#${item.heisig || '-'}</span>
        `;
        li.onclick = () => showKanjiDetails(key);
        listEl.appendChild(li);
      });
    }

    function parseStoryText(text) {
      if (!text) return '';
      const cleanText = decodeHtml(text);
      return cleanText.replace(/[\u4e00-\u9faf\u3400-\u4dbf]/g, (match) => {
        if (kanjiDb[match]) {
          return `<span class="kanji-link" onclick="showKanjiDetails('${match}')">${match}</span>`;
        }
        return match;
      });
    }

    function showKanjiDetails(kanji) {
      const data = kanjiDb[kanji];
      if (!data) return;

      activeKanji = kanji;
      window.location.hash = encodeURIComponent(kanji);

      document.querySelectorAll('#kanji-list li').forEach(el => el.classList.remove('active'));

      const componentsHtml = (data.components && data.components.length > 0)
        ? data.components.map(c => `
            <div class="tag-item" onclick="showKanjiDetails('${c}')">
              <span style="font-size:20px; font-weight:bold;">${c}</span>
              <span style="color:var(--text-muted); font-size:13px;">${kanjiDb[c] ? decodeHtml(kanjiDb[c].keyword) : ''}</span>
            </div>
          `).join('')
        : '<p style="color:var(--text-muted)">No components listed.</p>';

      const usedInHtml = (data.used_in && data.used_in.length > 0)
        ? data.used_in.map(c => `
            <div class="tag-item" onclick="showKanjiDetails('${c}')">
              <span style="font-size:20px; font-weight:bold;">${c}</span>
              <span style="color:var(--text-muted); font-size:13px;">${kanjiDb[c] ? decodeHtml(kanjiDb[c].keyword) : ''}</span>
            </div>
          `).join('')
        : '<p style="color:var(--text-muted)">Not used in other kanji in this dataset.</p>';

      document.getElementById('display-area').innerHTML = `
        <div class="kanji-header">
          <div class="main-kanji">${data.kanji}</div>
          <div>
            <div style="display:flex; align-items:center; gap:10px;">
              <span class="keyword-title">${decodeHtml(data.keyword)}</span>
              <span class="heisig-badge">RTK #${data.heisig}</span>
            </div>
            <div style="color:var(--text-muted); margin-top:6px;">Strokes: ${data.strokes || 'N/A'}</div>
          </div>
        </div>

        <div class="card">
          <div class="card-title">Story / Mnemonic</div>
          <div class="story-text">${parseStoryText(data.story)}</div>
        </div>

        <div class="card">
          <div class="card-title">Components / Primitives</div>
          <div class="tags-container">${componentsHtml}</div>
        </div>

        <div class="card">
          <div class="card-title">Used In (${data.used_in ? data.used_in.length : 0})</div>
          <div class="tags-container">${usedInHtml}</div>
        </div>
      `;
    }

    document.getElementById('search-input').addEventListener('input', (e) => {
      const q = e.target.value.toLowerCase().trim();
      if (!q) {
        renderList(Object.keys(kanjiDb));
        return;
      }
      const filtered = Object.keys(kanjiDb).filter(key => {
        const item = kanjiDb[key];
        const keywordClean = decodeHtml(item.keyword).toLowerCase();
        return item.kanji.includes(q) || 
               keywordClean.includes(q) || 
               item.heisig.toString().includes(q);
      });
      renderList(filtered);
    });

    window.onload = loadDatabase;
  </script>
</body>
</html>
